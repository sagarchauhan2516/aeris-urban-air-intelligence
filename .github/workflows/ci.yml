name: AERIS Continuous Integration & Testing Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Unit, Integration & Security Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Strict TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Next.js / ESLint Static Analysis
        run: npm run lint

      - name: Execute Full Jest Test Suite with Coverage
        run: npm run test:coverage
